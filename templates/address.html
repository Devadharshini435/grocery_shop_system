<!DOCTYPE html>
<html>
<head>
    <title>Delivery Address</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

<style>

:root {
    --emerald: #059669;
    --emerald-light: #10b981;
    --emerald-pale: #d1fae5;
    --border: #e5e7eb;
    --muted: #6b7280;
    --radius: 16px;
}

/* ── Background ───────────────────────── */
body {
    background: #f0fdf4;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(
        135deg,
        #ecfdf5 0%,
        #f0fdf4 50%,
        #e8f5f0 100%
    );
    z-index: -1;
}

/* ── Glass Container ─────────────────── */
.content-box {
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(16,185,129,0.12);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: 0 2px 40px rgba(5,150,105,0.08);
}

/* ── Header ──────────────────────────── */
.page-title {
    font-weight: 700;
    font-size: 1.6rem;
    color: #111827;
    margin-bottom: 6px;
}

.page-subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
}

/* ── Form Sections ───────────────────── */
.form-section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    transition: 0.2s;
}

.form-section:hover {
    border-color: rgba(16,185,129,0.35);
    box-shadow: 0 4px 16px rgba(5,150,105,0.06);
}

.section-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--emerald);
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

/* ── Labels ──────────────────────────── */
.form-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
}

/* ── Inputs ──────────────────────────── */
.form-control {
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 11px 14px;
    font-size: 0.92rem;
    transition: all 0.2s;
    color: #111827;
}

.form-control::placeholder {
    color: #9ca3af;
}

.form-control:focus {
    border-color: var(--emerald-light);
    box-shadow: 0 0 0 4px rgba(16,185,129,0.12);
}

textarea.form-control {
    resize: none;
}

/* ── Delivery Note ───────────────────── */
.delivery-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 14px;
}

/* ── Button ──────────────────────────── */
.btn-main {
    background: linear-gradient(
        135deg,
        var(--emerald-light),
        var(--emerald)
    );

    border: none;
    border-radius: 12px;

    font-weight: 600;
    font-size: 0.95rem;

    color: #fff;

    padding: 13px 20px;

    width: 100%;

    transition: 0.2s;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-main:hover {
    opacity: 0.92;
    transform: translateY(-1px);
    color: #fff;
}

/* ── Responsive ──────────────────────── */
@media (max-width: 576px) {

    .content-box {
        padding: 22px;
    }

    .page-title {
        font-size: 1.35rem;
    }
}

</style>

</head>

<body>

{% include 'navbar.html' %}

<div class="container mt-4 mb-5" style="max-width: 760px;">

    <div class="content-box">

        <!-- Header -->
        <div>
            <h2 class="page-title">Delivery Address</h2>

            <p class="page-subtitle">
                Enter your shipping information
            </p>
        </div>

        <form method="POST">

            <!-- Contact Section -->
            <div class="form-section">

                <div class="section-label">
                    Contact Details
                </div>

                <div class="row g-3">

                    <div class="col-md-7">
                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Priya Sharma"
                               required
                               value="{{ address['name'] if address else '' }}">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               placeholder="+91 98765 43210"
                               required
                               value="{{ address['phone'] if address else '' }}">
                    </div>

                </div>

            </div>

            <!-- Address Section -->
            <div class="form-section">

                <div class="section-label">
                    Shipping Address
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Street Address
                    </label>

                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              placeholder="Flat 4B, Sunrise Apartments, MG Road"
                              required>{{ address['address'] if address else '' }}</textarea>

                </div>

                <div class="row g-3">

                    <div class="col-md-7">

                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control"
                               placeholder="Chennai"
                               required
                               value="{{ address['city'] if address else '' }}">

                    </div>

                    <div class="col-md-5">

                        <label class="form-label">
                            Pincode
                        </label>

                        <input type="text"
                               name="pincode"
                               class="form-control"
                               placeholder="600001"
                               required
                               value="{{ address['pincode'] if address else '' }}">

                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="mt-3">

                <div class="delivery-hint">
                    <i class="bi bi-truck"></i>
                    Delivers in 3–5 business days
                </div>

                <button type="submit" class="btn-main">

                    <i class="bi bi-shield-lock-fill"></i>

                    Continue to Payment

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
