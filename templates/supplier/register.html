<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --orange: #ea580c;
            --orange-light: #f97316;
            --orange-pale: #fed7aa;
            --charcoal: #111827;
            --slate: #374151;
            --muted: #6b7280;
            --border: #e5e7eb;
            --radius: 16px;
            --radius-sm: 8px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Background */
        .bg-image {
            background-image: url('/static/images/bg2.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.7);
            position: fixed;
            inset: -20px;
            z-index: -1;
        }

        /* Center layout */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card */
        .register-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(15px);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top strip */
        .card-strip {
            background: linear-gradient(135deg, var(--orange-light), var(--orange));
            padding: 25px;
            text-align: center;
            color: white;
        }

        .card-strip i {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .card-strip h3 {
            margin: 0;
            font-weight: 700;
        }

        /* Body */
        .card-body {
            padding: 30px;
        }

        /* Tabs */
        .tab-wrapper {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--slate);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .form-control {
            padding-left: 38px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
        }

        textarea.form-control {
            padding-top: 12px;
            min-height: 90px;
        }

        .form-control:focus {
            border-color: var(--orange-light);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
        }

        /* Button */
        .btn-register {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--orange-light), var(--orange));
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, var(--orange), #c2410c);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer-text a {
            color: var(--orange);
            font-weight: 600;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Alert */
        .alert {
            font-size: 13px;
            border-radius: var(--radius-sm);
        }

    </style>
</head>

<body>

<div class="bg-image"></div>

<div class="page-wrapper">

    <div class="register-card">

        <!-- Top -->
        <div class="card-strip">
            <i class="fas fa-truck"></i>
            <h3>Supplier Register</h3>
            <p style="font-size:12px;">Create supplier account</p>
        </div>

        <!-- Body -->
        <div class="card-body">

            <!-- Tabs -->
            <div class="tab-wrapper">

                <div class="d-inline-flex p-1 rounded-pill"
                     style="
                        background: rgba(255,255,255,0.65);
                        border: 1px solid rgba(255,255,255,0.4);
                        backdrop-filter: blur(10px);
                     ">

                    <!-- Customer -->
                    <a href="/register"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-semibold"
                       style="
                            color: #059669;
                            font-size: 14px;
                       ">
                        Customer
                    </a>

                    <!-- Staff -->
                    <a href="/staff/register"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-semibold"
                       style="
                            color: #2563eb;
                            font-size: 14px;
                       ">
                        Staff
                    </a>

                    <!-- Supplier -->
                    <a href="/supplier/register"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-bold"
                       style="
                            background: linear-gradient(135deg, #f97316, #ea580c);
                            color: white;
                            font-size: 14px;
                       ">
                        Supplier
                    </a>

                </div>

            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-danger text-center">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Form -->
            <form action="/supplier/register" method="POST">

                <!-- Supplier Name -->
                <div class="form-group">
                    <label class="form-label">Supplier Name</label>

                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>

                        <input type="text"
                               name="supplier_name"
                               class="form-control"
                               placeholder="Enter supplier name"
                               required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email Address</label>

                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter email address"
                               required>
                    </div>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>

                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               placeholder="Enter phone number"
                               required>
                    </div>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label class="form-label">Address</label>

                    <div class="input-wrapper">
                        <i class="fas fa-location-dot"></i>

                        <textarea name="address"
                                  class="form-control"
                                  placeholder="Enter address"
                                  required></textarea>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Password</label>

                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Create password"
                               required>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i>
                    Register
                </button>

            </form>

            <!-- Footer -->
            <div class="footer-text">
                Already have an account?
                <a href="/supplier/login">Login</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
