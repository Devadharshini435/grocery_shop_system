<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>My Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            font-family:Segoe UI;
        }

        .card-box{
            background:white;
            padding:25px;
            border-radius:15px;
            margin-top:40px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .title{
            color:#ea580c;
            font-weight:700;
            margin-bottom:20px;
        }

        table{
            background:white;
        }

        img{
            border-radius:10px;
            object-fit:cover;
        }

    </style>

</head>

<body>
    <h6 class="mb-3">

    <strong>Supplier Name:</strong>
    {{ supplier.supplier_name }}

</h6>

<div class="container">

    <div class="card-box">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h2 class="title m-0">
                My Products
            </h2>

            <a href="/supplier/dashboard"
               class="btn btn-secondary">
                Back
            </a>

        </div>

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Category</th>
                    <th>Product</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>

            </thead>

            <tbody>

    {% for product in products %}

    <tr>

        <td>{{ product.product_id }}</td>

        <td>
            <img src="{{ url_for('static',
            filename='uploads/' + product.image) }}"
            width="70"
            height="70">
        </td>

        <td>{{ product.category }}</td>

        <td>{{ product.product_name }}</td>

        <td>{{ product.description }}</td>

        <td>₹ {{ product.price }}</td>

        <td>{{ product.stock }}</td>

    </tr>

    {% endfor %}

</tbody>
        </table>

    </div>

</div>

</body>
</html>
