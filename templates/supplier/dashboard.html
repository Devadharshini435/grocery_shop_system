<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Supplier Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
            font-family:Segoe UI;
        }

        .dashboard-card{
            max-width:700px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .title{
            color:#ea580c;
            font-weight:700;
            margin-bottom:25px;
        }

        .info{
            margin-bottom:15px;
            font-size:16px;
        }

        .btn-orange{
            background:#ea580c;
            color:white;
            border:none;
        }

        .btn-orange:hover{
            background:#c2410c;
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="dashboard-card">

        <h2 class="title">
            Supplier Dashboard
        </h2>

        <div class="info">
            <strong>Supplier Name:</strong>
            {{ supplier.supplier_name }}
        </div>

        <div class="info">
            <strong>Email:</strong>
            {{ supplier.email }}
        </div>

        <div class="info">
            <strong>Phone:</strong>
            {{ supplier.phone }}
        </div>

        <div class="info">
            <strong>Address:</strong>
            {{ supplier.address }}
        </div>

        <hr>

        <h5 class="mb-3">
            Product Supply Section
        </h5>

        <div class="d-flex gap-2">

            <a href="/supplier/add-product"
               class="btn btn-orange">
                Add Supplied Product
            </a>

            <a href="/supplier/my-products"
               class="btn btn-dark">
                My Products
            </a>

        </div>

    </div>

</div>

</body>
</html>
