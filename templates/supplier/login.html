<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --orange: #ea580c;
            --orange-light: #f97316;
            --charcoal: #111827;
            --slate: #374151;
            --muted: #6b7280;
            --border: #e5e7eb;
            --radius: 16px;
            --radius-sm: 8px;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Background */
        .bg-image {
            background-image: url('/static/images/bg2.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.7);
            position: fixed;
            inset: -20px;
            z-index: -1;
        }

        /* Center */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card */
        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Top */
        .card-strip {
            background: linear-gradient(135deg, #f97316, #ea580c);
            padding: 28px;
            text-align: center;
            color: white;
        }

        .card-strip i {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .card-strip h3 {
            margin: 0;
            font-weight: 700;
        }

        .card-body-inner {
            padding: 30px;
        }

        /* Tabs */
        .tab-wrapper {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Form */
        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--slate);
            margin-bottom: 6px;
            display: block;
        }

        .field-wrapper {
            position: relative;
        }

        .field-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .field-input {
            width: 100%;
            padding: 11px 38px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            outline: none;
        }

        .field-input:focus {
            border-color: var(--orange-light);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
        }

        /* Password Toggle */
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #ea580c, #c2410c);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: var(--muted);
        }

        .footer-text a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 600;
        }

        /* Alerts */
        .alert {
            font-size: 13px;
            border-radius: var(--radius-sm);
        }

    </style>
</head>

<body>

<div class="bg-image"></div>

<div class="page-wrapper">

    <div class="login-card">

        <!-- Top -->
        <div class="card-strip">
            <i class="fas fa-truck"></i>
            <h3>Supplier Portal</h3>
            <p style="font-size:12px;">
                Sign in to continue
            </p>
        </div>

        <!-- Body -->
        <div class="card-body-inner">

            <!-- Tabs -->
            <div class="tab-wrapper">

                <div class="d-inline-flex p-1 rounded-pill"
                     style="
                        background: rgba(255,255,255,0.65);
                        border: 1px solid rgba(255,255,255,0.4);
                     ">

                    <!-- Customer -->
                    <a href="/login"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-semibold"
                       style="color:#059669;">
                        Customer
                    </a>

                    <!-- Staff -->
                    <a href="/staff/login"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-semibold"
                       style="color:#2563eb;">
                        Staff
                    </a>

                    <!-- Supplier -->
                    <a href="/supplier/login"
                       class="text-decoration-none px-4 py-2 rounded-pill fw-bold"
                       style="
                            background: linear-gradient(135deg, #f97316, #ea580c);
                            color:white;
                       ">
                        Supplier
                    </a>

                </div>

            </div>

            <!-- Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-danger text-center">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Form -->
            <form method="POST">

                <!-- Email -->
                <div class="field-group">

                    <label class="field-label">
                        Email Address
                    </label>

                    <div class="field-wrapper">

                        <i class="fas fa-envelope field-icon"></i>

                        <input type="email"
                               name="email"
                               class="field-input"
                               placeholder="Enter email"
                               required>

                    </div>

                </div>

                <!-- Password -->
                <div class="field-group">

                    <label class="field-label">
                        Password
                    </label>

                    <div class="field-wrapper">

                        <i class="fas fa-lock field-icon"></i>

                        <input type="password"
                               name="password"
                               id="password"
                               class="field-input"
                               placeholder="Enter password"
                               required>

                        <button type="button"
                                class="toggle-pw"
                                onclick="togglePw()">

                            <i class="fas fa-eye" id="pwIcon"></i>

                        </button>

                    </div>

                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login">
                    <i class="fas fa-right-to-bracket"></i>
                    Login
                </button>

            </form>

            <!-- Footer -->
            <div class="footer-text">
                Don't have an account?
                <a href="/supplier/register">Register</a>
            </div>

        </div>

    </div>

</div>

<script>

function togglePw() {

    const input = document.getElementById('password');
    const icon = document.getElementById('pwIcon');

    if(input.type === 'password') {

        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');

    } else {

        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');

    }
}

</script>

</body>
</html>
