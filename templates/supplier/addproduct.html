<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root{
            --orange:#ea580c;
            --orange-light:#f97316;
            --border:#e5e7eb;
            --muted:#6b7280;
        }

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#f3f4f6;
        }

        /* Background */

        .bg-image{
            background-image:url('/static/images/bg2.jpg');
            background-size:cover;
            background-position:center;
            filter:blur(8px) brightness(0.6);
            position:fixed;
            inset:-20px;
            z-index:-1;
        }

        /* Center */

        .page-wrapper{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        /* Card */

        .product-card{
            width:100%;
            max-width:550px;
            background:rgba(255,255,255,0.95);
            backdrop-filter:blur(12px);
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(0,0,0,0.25);
        }

        /* Header */

        .card-header-custom{
            background:linear-gradient(135deg,#f97316,#ea580c);
            padding:28px;
            text-align:center;
            color:white;
        }

        .card-header-custom i{
            font-size:30px;
            margin-bottom:10px;
        }

        .card-header-custom h2{
            margin:0;
            font-weight:700;
        }

        .card-header-custom p{
            margin-top:5px;
            font-size:13px;
        }

        /* Body */

        .card-body-custom{
            padding:30px;
        }

        /* Form */

        .form-group{
            margin-bottom:18px;
        }

        .form-label{
            font-size:13px;
            font-weight:600;
            margin-bottom:6px;
            color:#374151;
        }

        .input-wrapper{
            position:relative;
        }

        .input-wrapper i{
            position:absolute;
            top:50%;
            left:12px;
            transform:translateY(-50%);
            color:var(--muted);
        }

        .form-control{
            padding-left:40px;
            border:1.5px solid var(--border);
            border-radius:12px;
            height:48px;
        }

        textarea.form-control{
            height:100px;
            padding-top:12px;
        }

        .form-control:focus{
            border-color:var(--orange-light);
            box-shadow:0 0 0 3px rgba(249,115,22,0.15);
        }

        /* Button */

        .btn-orange{
            width:100%;
            padding:13px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#f97316,#ea580c);
            color:white;
            font-weight:700;
            font-size:15px;
            transition:0.3s;
        }

        .btn-orange:hover{
            background:linear-gradient(135deg,#ea580c,#c2410c);
        }

        /* Alert */

        .alert{
            border-radius:12px;
            font-size:14px;
        }

    </style>

</head>
<body>

<div class="bg-image"></div>

<div class="page-wrapper">

    <div class="product-card">

        <!-- Header -->

        <div class="card-header-custom">

            <i class="fas fa-box-open"></i>

            <h2>Add Product</h2>

            <p>Supplier / Staff Product Management</p>

        </div>

        <!-- Body -->

        <div class="card-body-custom">

            <!-- Flash Message -->

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}

                  <div class="alert alert-success text-center">
                      {{ message }}
                  </div>

                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Form -->

            <form method="POST" enctype="multipart/form-data">

                <!-- Category -->

                <div class="form-group">

                    <label class="form-label">
                        Category
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-layer-group"></i>

                        <input type="text"
                               name="category"
                               class="form-control"
                               placeholder="Enter category"
                               required>

                    </div>

                </div>

                <!-- Product Name -->

                <div class="form-group">

                    <label class="form-label">
                        Product Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-box"></i>

                        <input type="text"
                               name="product_name"
                               class="form-control"
                               placeholder="Enter product name"
                               required>

                    </div>

                </div>

                <!-- Description -->

                <div class="form-group">

                    <label class="form-label">
                        Description
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-align-left"
                           style="top:18px;"></i>

                        <textarea name="description"
                                  class="form-control"
                                  placeholder="Enter description"
                                  required></textarea>

                    </div>

                </div>

                <!-- Price -->

                <div class="form-group">

                    <label class="form-label">
                        Price
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-indian-rupee-sign"></i>

                        <input type="number"
                               step="0.01"
                               name="price"
                               class="form-control"
                               placeholder="Enter price"
                               required>

                    </div>

                </div>

                <!-- Stock -->

                <div class="form-group">

                    <label class="form-label">
                        Stock
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-cubes"></i>

                        <input type="number"
                               name="stock"
                               class="form-control"
                               placeholder="Enter stock quantity"
                               required>

                    </div>

                </div>

                <!-- Image Upload -->

                <div class="form-group">

                    <label class="form-label">
                        Product Image
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-image"></i>

                        <input type="file"
                               name="image"
                               class="form-control"
                               accept="image/*"
                               required>

                    </div>

                </div>

                <!-- Submit -->

                <button type="submit"
                        class="btn-orange">

                    <i class="fas fa-plus-circle"></i>
                    Add Product

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
